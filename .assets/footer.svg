<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-labelledby="title">
  <title id="title">Build • Learn • Grow</title>
  <defs>
    <linearGradient id="lineL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lineR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .word { font-size: 22px; letter-spacing: 9px; fill: #8b949e; }
  </style>

  <rect width="1280" height="120" fill="#0d1117"/>
  <ellipse cx="640" cy="60" rx="360" ry="46" fill="url(#glow)"/>

  <!-- side rules with glow -->
  <rect x="40" y="59" width="330" height="2" fill="url(#lineL)" filter="url(#soft)"/>
  <rect x="40" y="59.5" width="330" height="1" fill="url(#lineL)"/>
  <rect x="910" y="59" width="330" height="2" fill="url(#lineR)" filter="url(#soft)"/>
  <rect x="910" y="59.5" width="330" height="1" fill="url(#lineR)"/>

  <!-- end caps -->
  <rect x="370" y="56" width="8" height="8" transform="rotate(45 374 60)" fill="#2f81f7"/>
  <rect x="902" y="56" width="8" height="8" transform="rotate(45 906 60)" fill="#2f81f7"/>

  <!-- words -->
  <text x="644" y="68" text-anchor="middle" class="mono word">BUILD<tspan fill="#2f81f7" dx="10">•</tspan><tspan dx="10">LEARN</tspan><tspan fill="#2f81f7" dx="10">•</tspan><tspan dx="10">GROW</tspan></text>
</svg>
